<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruta 100 · Estudios Sociales</title>
<meta name="description" content="Práctica interactiva de 0 a 100 para el I examen del II periodo de Estudios Sociales, décimo año (CTP): Guerra Fría, descolonización y movimientos sociales.">
<meta name="theme-color" content="#0a0f24">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS · Psicología del color
   Cian = claridad (Guía) · Azul = concentración (Conocimiento)
   Verde = crecimiento (Aplicación) · Violeta = pensamiento profundo (Análisis)
   Ámbar = logro y motivación (Simulacro) · Coral suave = error sin ansiedad
   ========================================================= */
:root{
  --fs:1;
  --bg:#f3f6fd; --solid:#ffffff; --surface:rgba(255,255,255,.80); --surface-2:#eef2fb;
  --border:rgba(30,41,99,.13); --text:#161d3b; --muted:#525c86;
  --lv0:#0e7490; --lv1:#1d4ed8; --lv2:#047857; --lv3:#6d28d9; --exam:#b45309;
  --on-c:#ffffff;
  --ok:#047857; --ok-bg:#dcfce7; --bad:#be123c; --bad-bg:#ffe4e6; --part:#a16207; --part-bg:#fef3c7;
  --focus:#f59e0b; --aurora-op:.20;
  --shadow:0 12px 32px -16px rgba(30,41,99,.35);
  --radius:20px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a0f24; --solid:#141b3b; --surface:rgba(22,30,66,.72); --surface-2:rgba(255,255,255,.06);
    --border:rgba(255,255,255,.12); --text:#ecf1ff; --muted:#a7b1d6;
    --lv0:#22d3ee; --lv1:#7cb2ff; --lv2:#34d399; --lv3:#b69cff; --exam:#fbbf24;
    --on-c:#0a0f24;
    --ok:#4ade80; --ok-bg:rgba(74,222,128,.13); --bad:#fb7185; --bad-bg:rgba(251,113,133,.14); --part:#fbbf24; --part-bg:rgba(251,191,36,.13);
    --aurora-op:.34; --shadow:0 20px 44px -20px rgba(0,0,0,.75);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0f24; --solid:#141b3b; --surface:rgba(22,30,66,.72); --surface-2:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.12); --text:#ecf1ff; --muted:#a7b1d6;
  --lv0:#22d3ee; --lv1:#7cb2ff; --lv2:#34d399; --lv3:#b69cff; --exam:#fbbf24;
  --on-c:#0a0f24;
  --ok:#4ade80; --ok-bg:rgba(74,222,128,.13); --bad:#fb7185; --bad-bg:rgba(251,113,133,.14); --part:#fbbf24; --part-bg:rgba(251,191,36,.13);
  --aurora-op:.34; --shadow:0 20px 44px -20px rgba(0,0,0,.75);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{font-size:calc(106.25% * var(--fs)); -webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  line-height:1.6; min-height:100vh; overflow-x:hidden;
}
h1,h2,h3{font-family:'Fraunces', Georgia, serif; line-height:1.2; margin:0 0 .5em; letter-spacing:-.01em}
h1{font-size:clamp(1.7rem, 5vw, 2.6rem); font-weight:800}
h2{font-size:clamp(1.35rem, 3.6vw, 1.8rem)}
h3{font-size:1.15rem}
p{margin:.4em 0 .8em}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus); outline-offset:3px; border-radius:8px}
h1[tabindex="-1"]:focus,h2[tabindex="-1"]:focus{outline:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;background:var(--solid);color:var(--text);padding:10px 14px;border-radius:10px;z-index:50;box-shadow:var(--shadow)}
.skip:focus{top:12px}

/* ---------- Fondo inmersivo ---------- */
.aurora{position:fixed; inset:0; z-index:-1; overflow:hidden; background:var(--bg); pointer-events:none}
.aurora span{position:absolute; border-radius:50%; filter:blur(90px); opacity:var(--aurora-op); animation:drift 38s ease-in-out infinite alternate}
.aurora .a1{width:62vmax;height:62vmax;background:var(--lv1);top:-24vmax;left:-18vmax}
.aurora .a2{width:58vmax;height:58vmax;background:var(--lv2);bottom:-28vmax;right:-22vmax;animation-delay:-12s}
.aurora .a3{width:40vmax;height:40vmax;background:var(--lv3);top:35%;left:45%;animation-delay:-24s;opacity:calc(var(--aurora-op)*.7)}
.aurora::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.35) 1px, transparent 1.4px);background-size:46px 46px;opacity:.06}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.12)}}

/* ---------- Layout ---------- */
.topbar{position:sticky; top:0; z-index:20; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); background:color-mix(in srgb, var(--bg) 72%, transparent); border-bottom:1px solid var(--border)}
.topbar .in{max-width:980px; margin:0 auto; display:flex; align-items:center; gap:10px; padding:10px 16px}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; font-weight:700; margin-right:auto; min-width:0}
.brand .logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--lv1),var(--lv3));color:#fff;font-family:'Fraunces',serif;font-weight:800;font-size:.95rem;flex:none}
.brand small{display:block;color:var(--muted);font-weight:400;font-size:.78rem;line-height:1.2}
.brand .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{min-width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-weight:700;cursor:pointer;display:inline-grid;place-items:center;padding:0 10px}
.iconbtn:hover{background:var(--surface-2)}
@media (max-width:420px){.topbar .in{gap:6px;padding:8px 12px}.iconbtn{min-width:40px;height:40px;padding:0 6px}.brand small{display:none}}
main{max-width:980px; margin:0 auto; padding:22px 16px 80px}
main:focus{outline:none}
footer{max-width:980px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:.85rem;text-align:center}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); padding:22px}
.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.muted{color:var(--muted)}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.74rem;font-weight:700;color:var(--muted)}
.stack>*+*{margin-top:14px}

/* ---------- Buttons ---------- */
.btn{--c:var(--lv1); display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:14px;border:2px solid transparent;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .15s, box-shadow .15s, background .15s}
.btn.primary{background:var(--c);color:var(--on-c);box-shadow:0 8px 20px -10px var(--c)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 12px 24px -10px var(--c)}
.btn.ghost{background:transparent;border-color:var(--border);color:var(--text)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:40px;padding:6px 14px;font-size:.92rem;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* ---------- Hero ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding:28px}
.hero h1 span{background:linear-gradient(90deg,var(--lv1),var(--lv3));-webkit-background-clip:text;background-clip:text;color:transparent}
.ring{--p:0;--c:var(--lv2);width:168px;height:168px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--surface-2);stroke-width:12;fill:none}
.ring .val{stroke:var(--c);stroke-width:12;fill:none;stroke-linecap:round;transition:stroke-dashoffset 1s ease}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .lbl b{font-family:'Fraunces',serif;font-size:2.6rem;line-height:1;display:block}
.ring .lbl small{color:var(--muted);font-size:.8rem}
@media (max-width:640px){ .hero{grid-template-columns:1fr;text-align:center;padding:22px} .hero .ring{margin:0 auto;order:-1;width:150px;height:150px} .hero .row{justify-content:center} }

/* ---------- Route ---------- */
.route{position:relative;display:grid;gap:12px}
.step{--c:var(--lv1);display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;text-decoration:none;padding:16px 18px;border-left:5px solid var(--c);transition:transform .15s}
.step:hover{transform:translateX(3px)}
.step .ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:1.6rem;background:color-mix(in srgb,var(--c) 16%,transparent)}
.step h3{margin:0 0 2px}
.step p{margin:0;color:var(--muted);font-size:.92rem}
.step .score{text-align:right;font-weight:700;color:var(--c);font-size:1.05rem;white-space:nowrap}
.step .score small{display:block;color:var(--muted);font-weight:400;font-size:.75rem}
.minibar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.minibar span{display:block;height:100%;background:var(--c,var(--lv2));border-radius:99px;transition:width .8s}
@media (max-width:520px){ .step{grid-template-columns:46px 1fr;padding:14px} .step .ico{width:46px;height:46px;font-size:1.3rem} .step .score{grid-column:2;text-align:left} }

.tool{text-decoration:none;display:flex;gap:12px;align-items:flex-start;padding:16px}
.tool .ico{font-size:1.6rem;line-height:1}
.tool h3{margin:0 0 2px;font-size:1.05rem}
.tool p{margin:0;font-size:.9rem;color:var(--muted)}

.mastery{display:grid;gap:10px}
.mastery .m{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:4px 12px;align-items:center;text-decoration:none}
.mastery .m .n{font-size:.95rem}
.mastery .m .v{font-weight:700;text-align:right;font-size:.9rem}
.mastery .m .minibar{grid-column:1/-1;margin:0}

/* ---------- Chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{--c:var(--lv1);display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:.8rem;font-weight:700;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.chip.neutral{--c:var(--muted)}

/* ---------- Guide ---------- */
.topic-head{--c:var(--lv0);border-top:6px solid var(--c)}
.guide h3{margin-top:1.4em;color:var(--text)}
.guide ul{padding-left:1.2em;margin:.3em 0 .9em}
.guide li{margin:.25em 0}
.callout{border-radius:14px;padding:14px 16px;margin:14px 0;border:1px solid var(--border);background:var(--surface-2)}
.callout b.t{display:block;margin-bottom:4px}
.callout.key{border-left:5px solid var(--lv1)}
.callout.trick{border-left:5px solid var(--exam)}
.callout.link{border-left:5px solid var(--lv3)}
.tbl-wrap{overflow-x:auto;margin:12px 0;border-radius:14px;border:1px solid var(--border)}
table{border-collapse:collapse;width:100%;font-size:.92rem;min-width:520px}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--border)}
th{background:var(--surface-2);font-weight:700}
tr:last-child td{border-bottom:0}
.concepts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin:12px 0}
.concepts div{background:var(--surface-2);border-radius:14px;padding:12px 14px;border:1px solid var(--border)}
.concepts b{display:block;color:var(--lv1)}
.topic-list .tool{border-left:5px solid var(--lv0)}
.done-badge{color:var(--ok);font-weight:700;font-size:.85rem}

/* ---------- Quiz ---------- */
.quiz-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qprog{flex:1}
.qprog .minibar{height:10px;margin:0 0 4px}
.qprog small{color:var(--muted)}
.pill{padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--border);font-weight:700;white-space:nowrap;font-size:.9rem}
.part-head{--c:var(--exam);margin:0 0 14px;padding:14px 18px;border-left:5px solid var(--c)}
.part-head h2{font-size:1.2rem;margin:0}
.part-head p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.qcard{--c:var(--lv1);border-top:6px solid var(--c)}
.q{font-size:1.14rem;font-weight:700;margin:0 0 14px;line-height:1.45}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;float:left;width:100%}
legend + *{clear:both}
.source{margin:0 0 16px;padding:14px 18px;border-radius:14px;background:var(--surface-2);border-left:5px solid var(--lv3);font-style:italic}
.source cite{display:block;margin-top:6px;font-style:normal;font-size:.85rem;color:var(--muted)}
.source .tag{font-style:normal;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--lv3);display:block;margin-bottom:4px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;border:2px solid var(--border);background:var(--solid);cursor:pointer;transition:border-color .15s, background .15s}
.opt:hover{border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .letter{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid var(--border);font-size:.9rem}
.opt:has(input:checked){border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--solid))}
.opt:has(input:checked) .letter{background:var(--c);color:var(--on-c);border-color:var(--c)}
.opt:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.opt.is-ok{border-color:var(--ok)!important;background:var(--ok-bg)!important}
.opt.is-ok .letter{background:var(--ok)!important;border-color:var(--ok)!important;color:var(--on-c)!important}
.opt.is-bad{border-color:var(--bad)!important;background:var(--bad-bg)!important}
.opt.is-bad .letter{background:var(--bad)!important;border-color:var(--bad)!important;color:var(--on-c)!important}
.locked .opt{cursor:default}

.match{display:grid;gap:18px;grid-template-columns:1fr 1fr}
@media (max-width:720px){.match{grid-template-columns:1fr}}
.match h4{margin:0 0 8px;font-size:.85rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.match ol,.match ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 12px;border-radius:12px;border:2px solid var(--border);background:var(--solid)}
.mrow label{font-weight:700}
.colB li{padding:8px 12px;border-radius:12px;background:var(--surface-2);font-size:.95rem}
.colB li b{color:var(--c);margin-right:6px}
select,input[type=text],textarea{font:inherit;color:var(--text);background:var(--solid);border:2px solid var(--border);border-radius:12px;padding:10px 12px;width:100%;min-height:46px}
select:focus,input[type=text]:focus,textarea:focus{border-color:var(--c);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
textarea{min-height:170px;resize:vertical;line-height:1.55}
.is-ok-row{border-color:var(--ok)!important;background:var(--ok-bg)!important}
.is-bad-row{border-color:var(--bad)!important;background:var(--bad-bg)!important}

.olist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.oitem{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;border:2px solid var(--border);background:var(--solid)}
.oitem .num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.oitem .mv{display:flex;gap:6px}
.oitem .mv button{width:44px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:1.1rem;cursor:pointer}
.oitem .mv button:disabled{opacity:.3;cursor:default}
.oitem.flash{animation:flash .5s}
@keyframes flash{from{background:color-mix(in srgb,var(--c) 22%,var(--solid))}}

.crow{padding:12px 14px;border-radius:14px;border:2px solid var(--border);background:var(--solid)}
.crow .ct{font-weight:700;margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:inline-block;padding:8px 14px;border-radius:99px;border:2px solid var(--border);cursor:pointer;font-size:.92rem;font-weight:700;min-height:40px}
.seg input:checked + span{background:var(--c);border-color:var(--c);color:var(--on-c)}
.seg input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}
.clist{display:grid;gap:8px}

.counter{font-size:.82rem;color:var(--muted);text-align:right;margin-top:4px}

/* ---------- Feedback ---------- */
.feedback:empty{display:none}
.feedback{margin-top:18px}
.feedback:focus{outline:none}
.fb{border-radius:16px;padding:16px 18px;border:2px solid;animation:rise .35s ease}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb.partial{border-color:var(--part);background:var(--part-bg)}
.fb-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.fb-head strong{font-size:1.08rem}
.fb-icon{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:var(--on-c)}
.fb.ok .fb-icon{background:var(--ok)} .fb.bad .fb-icon{background:var(--bad)} .fb.partial .fb-icon{background:var(--part)}
.fb-pts{margin-left:auto;font-weight:700;font-size:.9rem}
.fb p{margin:.35em 0}
.fb .why{padding-left:12px;border-left:3px solid var(--border)}
.fb-exp,.fb-tip,.model{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--solid);border:1px solid var(--border)}
.fb ul{margin:.3em 0;padding-left:1.2em}
.fb li.okc::marker{content:"✓  ";color:var(--ok)}
.fb li.badc::marker{content:"✗  ";color:var(--bad)}
.yours{white-space:pre-wrap;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:.95rem;margin:6px 0}
.rubric{display:grid;gap:8px;margin:8px 0}
.rubric label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--solid);border:1px solid var(--border);cursor:pointer}
.rubric input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--ok)}
.level-tag{display:inline-block;padding:2px 10px;border-radius:99px;font-weight:700;font-size:.85rem;background:var(--solid);border:1px solid var(--border)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.actions{margin-top:18px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}

/* ---------- Results ---------- */
.res-head{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
@media (max-width:600px){.res-head{grid-template-columns:1fr;text-align:center}.res-head .ring{margin:0 auto}}
.review details{border:1px solid var(--border);border-radius:14px;background:var(--solid);margin-bottom:8px}
.review summary{cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;list-style:none}
.review summary::-webkit-details-marker{display:none}
.review summary .st{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:var(--on-c);font-size:.85rem}
.st.ok{background:var(--ok)} .st.bad{background:var(--bad)} .st.partial{background:var(--part)}
.review summary .sq{flex:1;font-size:.95rem}
.review summary .sp{font-weight:700;white-space:nowrap;font-size:.9rem}
.review .body{padding:0 14px 14px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:10px;height:14px;border-radius:3px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}

/* ---------- Flashcards ---------- */
.flash-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.fc{perspective:1000px;min-height:190px;border:0;background:none;padding:0;cursor:pointer;font:inherit;color:inherit;text-align:left}
.fc .inner{position:relative;width:100%;height:100%;min-height:190px;transition:transform .55s;transform-style:preserve-3d}
.fc[aria-pressed="true"] .inner{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:16px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--border);box-shadow:var(--shadow)}
.fc .front{background:linear-gradient(145deg,color-mix(in srgb,var(--c) 22%,var(--solid)),var(--solid));}
.fc .front b{font-family:'Fraunces',serif;font-size:1.3rem}
.fc .front small{color:var(--muted);margin-top:8px}
.fc .back{background:var(--solid);transform:rotateY(180deg);font-size:.95rem;overflow:auto}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
.filters button{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:99px;padding:6px 14px;font:inherit;font-size:.88rem;cursor:pointer;min-height:38px}
.filters button[aria-pressed="true"]{background:var(--lv1);color:var(--on-c);border-color:var(--lv1)}

/* ---------- Timeline ---------- */
.tl{position:relative;margin:0;padding:0 0 0 26px;list-style:none}
.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:3px;border-radius:3px;background:linear-gradient(var(--lv1),var(--lv2),var(--lv3),var(--exam))}
.tl li{position:relative;margin:0 0 12px}
.tl li::before{content:"";position:absolute;left:-23px;top:18px;width:14px;height:14px;border-radius:50%;background:var(--c);border:3px solid var(--bg)}
.tl .ev{padding:12px 16px;border-left:4px solid var(--c)}
.tl .yr{font-family:'Fraunces',serif;font-weight:800;font-size:1.2rem;color:var(--c);margin-right:8px}
.phase-title{margin:22px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.phase-title h2{margin:0;font-size:1.25rem}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--solid);color:var(--text);border:1px solid var(--border);box-shadow:var(--shadow);padding:12px 18px;border-radius:14px;z-index:70;font-weight:700;animation:rise .3s}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .aurora span{animation:none}
  .confetti{display:none}
}

<script>

const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2400); }

/* =========================================================
   ESTADO (localStorage, con respaldo en memoria)

const TOPICS = {
T1: { short: 'Conceptos clave', title: 'Conceptos clave y el concepto de Guerra Fría', icon: '🧩', ae: 1, html: `
<p>La <b>Guerra Fría</b> fue el enfrentamiento <b>político, ideológico, económico, tecnológico y cultural</b> entre <b>Estados Unidos</b> (capitalismo, democracia liberal) y la <b>Unión Soviética – URSS</b> (socialismo/comunismo, partido único), desde el fin de la Segunda Guerra Mundial (1945-1947) hasta la disolución de la URSS (1991).</p>
<div class="callout key"><b class="t">¿Por qué “fría”?</b>Porque las dos superpotencias <b>nunca se enfrentaron militarmente de forma directa</b>: el miedo a una guerra nuclear lo impidió. Compitieron mediante alianzas, propaganda, carrera armamentista y espacial, y <b>conflictos indirectos</b> (guerras en otros países como Corea, Vietnam o Afganistán).</div>
<p>El mundo quedó <b>bipolar</b>: el poder se concentró en dos polos, cada uno con su área de influencia (bloque occidental o capitalista y bloque oriental o socialista).</p>
<h3>Conceptos que debes dominar</h3>
<div class="concepts">
<div><b>Conflicto</b>Oposición o enfrentamiento entre personas, grupos o Estados por intereses, valores o recursos. Puede ser armado o no armado.</div>
<div><b>Democracia</b>Sistema en que el poder reside en el pueblo, que elige a sus gobernantes en elecciones libres; respeta derechos y la división de poderes.</div>
<div><b>Gobierno</b>Conjunto de personas e instituciones que dirigen y administran un Estado.</div>
<div><b>Convención internacional</b>Acuerdo o tratado entre Estados que crea obligaciones jurídicas. Ej.: Convención para la Prevención y la Sanción del Delito de Genocidio (ONU, 1948).</div>
<div><b>Dictadura</b>Régimen en que el poder se concentra en una persona o grupo, sin control ciudadano; suele censurar y perseguir a la oposición.</div>
<div><b>Ideología</b>Conjunto de ideas, creencias y valores que explican la sociedad y orientan la acción política (capitalismo liberal vs. comunismo).</div>
<div><b>Imperialismo</b>Política de expansión y dominio de un Estado sobre otros territorios (político, económico, militar o cultural). Cada bloque acusaba al otro de imperialista.</div>
<div><b>Liberalismo</b>Doctrina que defiende las libertades individuales, la propiedad privada, el libre mercado y los límites al poder del Estado. Base del bloque occidental.</div>
<div><b>Genocidio</b>Actos cometidos con la intención de destruir, total o parcialmente, a un grupo nacional, étnico, racial o religioso. Término creado por Raphael Lemkin (1944).</div>
</div>
<div class="callout trick"><b class="t">Truco para recordar</b>Democracia ↔ Dictadura son opuestos en <i>cómo se ejerce el poder</i>; Liberalismo ↔ Comunismo son opuestos en <i>ideología económica</i>.</div>` },

T2: { short: 'Causas y bloques militares', title: 'Causas de la Guerra Fría y bloques militares', icon: '🛡️', ae: 1, html: `
<h3>Causas principales</h3>
<ul>
<li><b>Diferencias ideológicas irreconciliables:</b> capitalismo y democracia liberal (EE. UU.) frente a socialismo con partido único (URSS).</li>
<li><b>Vacío de poder tras la Segunda Guerra Mundial:</b> Europa quedó destruida y surgieron dos superpotencias.</li>
<li><b>Desacuerdos en Yalta y Potsdam (1945)</b> sobre el futuro de Alemania y Europa del Este.</li>
<li><b>Expansión soviética en Europa del Este</b> (“democracias populares”). Churchill habló en 1946 de un <b>“telón de acero”</b> que dividía Europa.</li>
<li><b>Doctrina Truman (1947):</b> política de <b>contención</b> del comunismo. <b>Plan Marshall (1947):</b> ayuda económica para reconstruir Europa occidental. La URSS respondió con el Kominform (1947) y el <b>COMECON</b> (1949).</li>
<li><b>Bloqueo de Berlín (1948-1949)</b> y división de Alemania en RFA (occidental) y RDA (socialista) en 1949.</li>
<li><b>Carrera nuclear:</b> EE. UU. tuvo el monopolio atómico hasta 1949, cuando la URSS probó su bomba.</li>
</ul>
<h3>Bloques militares</h3>
<div class="tbl-wrap"><table>
<thead><tr><th>Alianza</th><th>Año</th><th>Bloque</th><th>Miembros principales</th><th>Objetivo</th></tr></thead>
<tbody>
<tr><td><b>OTAN</b></td><td>1949</td><td>Capitalista</td><td>EE. UU., Canadá, Reino Unido, Francia, Italia, Bélgica, Países Bajos, Luxemburgo, Portugal, Noruega, Dinamarca, Islandia</td><td>Defensa colectiva: un ataque a un miembro es un ataque a todos (art. 5).</td></tr>
<tr><td><b>SEATO / OTASE</b></td><td>1954</td><td>Capitalista</td><td>EE. UU., Reino Unido, Francia, Australia, Nueva Zelanda, Filipinas, Tailandia, Pakistán</td><td>Frenar el comunismo en el Sudeste Asiático (“teoría del dominó”). Disuelta en 1977.</td></tr>
<tr><td><b>Pacto de Bagdad</b></td><td>1955</td><td>Capitalista</td><td>Turquía, Irak, Irán, Pakistán, Reino Unido (EE. UU. lo apoyaba)</td><td>Contener a la URSS en Medio Oriente. En 1959, tras salir Irak, pasó a llamarse CENTO.</td></tr>
<tr><td><b>Pacto de Varsovia</b></td><td>1955</td><td>Socialista</td><td>URSS, Polonia, RDA, Checoslovaquia, Hungría, Rumania, Bulgaria, Albania</td><td>Respuesta al ingreso de la RFA en la OTAN. Disuelto en 1991.</td></tr>
</tbody></table></div>

T3: { short: 'Fases de la Guerra Fría', title: 'Fases de la Guerra Fría y su fin', icon: '⏳', ae: 1, html: `
<p class="muted">Los libros de texto pueden variar levemente las fechas; lo importante es reconocer la lógica de cada etapa.</p>
<div class="tbl-wrap"><table>
<thead><tr><th>Fase</th><th>Años</th><th>Hechos clave</th></tr></thead>
<tbody>
<tr><td><b>1. Formación de bloques</b></td><td>1945-1953</td><td>Doctrina Truman, Plan Marshall, bloqueo de Berlín, OTAN, bomba atómica soviética y Revolución China (1949), Guerra de Corea (1950-1953).</td></tr>

<tr><td><b>5. Fin del conflicto</b></td><td>1985-1991</td><td>Gorbachov: <b>perestroika</b> (reestructuración económica) y <b>glasnost</b> (transparencia). Caída del Muro de Berlín (9 nov. 1989), reunificación alemana (1990), disolución del Pacto de Varsovia y de la URSS (1991).</td></tr>
</tbody></table></div>
<h3>Bloques capitalista y socialista</h3>
<p><b>Capitalista (occidental):</b> EE. UU., Europa occidental, Canadá, Japón y aliados. <b>Socialista (oriental):</b> URSS, Europa del Este, China (hasta su ruptura con la URSS en los años 60), Corea del Norte, Cuba, Vietnam del Norte. Muchos países recién independizados formaron el <b>Movimiento de Países No Alineados</b> (1961).</p>
<h3>Repercusiones políticas del fin</h3>
<ul>
<li>Fin del mundo bipolar: EE. UU. queda como única superpotencia.</li>
<li>La URSS se divide en <b>15 repúblicas independientes</b> (Rusia, Ucrania, Bielorrusia, los países bálticos, etc.).</li>
<li>Europa del Este pasa a democracias multipartidistas y economías de mercado; varios países ingresan después a la OTAN y a la Unión Europea.</li>
<li>Se acelera la <b>globalización</b> económica.</li>
</ul>
<div class="callout trick"><b class="t">Truco para recordar</b>“<b>F</b>ormar, <b>C</b>onvivir, <b>D</b>istender, <b>R</b>ebrotar, <b>T</b>erminar” → F-C-D-R-T.</div>` },

T4: { short: 'Rivalidad geopolítica', title: 'Expresiones de la rivalidad: armas, conflictos, propaganda y espacio', icon: '🚀', ae: 2, html: `
<h3>Carrera armamentista y amenaza nuclear</h3>
<ul>
<li>Bomba atómica: EE. UU. (1945) y URSS (1949). Bomba de hidrógeno: EE. UU. (1952) y URSS (1953). Luego, misiles intercontinentales y submarinos nucleares.</li>
<li><b>Destrucción Mutua Asegurada (MAD):</b> si uno atacaba, el otro respondía y ambos serían destruidos; esto <b>disuadía</b> el ataque (“equilibrio del terror”).</li>
<li>Vida cotidiana con miedo: refugios antinucleares y simulacros escolares “<i>Duck and Cover</i>” (agacharse y cubrirse) en EE. UU.</li>
<li><b>Crisis de los misiles en Cuba (octubre 1962):</b> EE. UU. descubrió misiles soviéticos en Cuba. Tras 13 días de tensión, la URSS los retiró a cambio de que EE. UU. no invadiera Cuba (y retirara en secreto sus misiles de Turquía). Fue el momento más cercano a una guerra nuclear.</li>
</ul>
<h3>Conflictos durante la Guerra Fría</h3>
<div class="tbl-wrap"><table>
<thead><tr><th>Conflicto</th><th>Causas</th><th>Consecuencias</th></tr></thead>
<tbody>
<tr><td><b>Guerra de Corea</b> (1950-1953)</td><td>Corea del Norte (apoyo soviético y chino) invade a Corea del Sur (apoyo de EE. UU. y la ONU).</td><td>Armisticio; la península sigue dividida en el paralelo 38.</td></tr>
<tr><td><b>Guerra de Vietnam</b> (1955-1975)</td><td>Vietnam del Norte comunista busca unificar el país; EE. UU. apoya al Sur para contener el comunismo.</td><td>Derrota de EE. UU. y unificación comunista (1975); fuertes protestas pacifistas.</td></tr>
<tr><td><b>Afganistán</b> (1979-1989)</td><td>La URSS invade para sostener un gobierno aliado; EE. UU. arma a los muyahidines.</td><td>Retirada soviética; desgaste económico de la URSS.</td></tr>
</tbody></table></div>
<h3>Propaganda en los medios de comunicación</h3>
<div class="tbl-wrap"><table>
<thead><tr><th></th><th>Propaganda de EE. UU. (capitalista)</th><th>Propaganda de la URSS (socialista)</th></tr></thead>
<tbody>
<tr><td><b>“Bondades” propias</b></td><td>Libertad individual, democracia, prosperidad y consumo: el “<i>American way of life</i>” (auto, televisión, electrodomésticos).</td><td>Igualdad, trabajo para todos, dignidad del obrero y el campesino, logros científicos y espaciales.</td></tr>
<tr><td><b>“Peligros” del rival</b></td><td>El comunismo como amenaza que quita la libertad, invade países y se infiltra (“Temor Rojo”).</td><td>El capitalismo como explotador, desigual, racista e imperialista.</td></tr>
<tr><td><b>Medios</b></td><td>Películas de Hollywood, cómics, radio (Voice of America, Radio Free Europe), televisión.</td><td>Carteles, cine, radio (Radio Moscú), prensa oficial (<i>Pravda</i>), deporte y ajedrez.</td></tr>
</tbody></table></div>
<p>El <b>macartismo</b> (senador Joseph McCarthy, década de 1950) fue una “caza de brujas” contra personas acusadas de comunistas, con listas negras en Hollywood.</p>
<h3>Avances en la exploración espacial</h3>
<ul>
<li><b>1957:</b> la URSS lanza el <b>Sputnik 1</b>, primer satélite artificial; luego la perra <b>Laika</b>, primer ser vivo en órbita. EE. UU. crea la <b>NASA</b> (1958).</li>
<li><b>1961:</b> <b>Yuri Gagarin</b> (URSS), primer ser humano en el espacio. <b>1963:</b> <b>Valentina Tereshkova</b>, primera mujer.</li>
<li><b>1969:</b> <b>Apolo 11</b> (EE. UU.): Neil Armstrong y Buzz Aldrin, primeros humanos en la Luna.</li>
<li><b>1975:</b> misión conjunta Apolo-Soyuz, símbolo de la distensión.</li>
</ul>
<div class="callout link"><b class="t">Conexión clave</b>Los cohetes que llevaban satélites también podían llevar bombas nucleares: la carrera espacial era también <b>militar y propagandística</b>.</div>` },

T6: { short: 'Movimientos sociales y contracultura', title: 'Luchas sociales y contracultura en la Guerra Fría', icon: '✊', ae: 3, html: `
<p><b>Contracultura:</b> movimientos que rechazan los valores dominantes de su sociedad (consumismo, autoritarismo, guerra, discriminación) y proponen formas de vida alternativas.</p>
<div class="concepts">
<div><b>Movimiento hippie</b>Años 60, EE. UU. (San Francisco). Pacifismo contra la Guerra de Vietnam (“<i>Haz el amor, no la guerra</i>”), rechazo al consumismo, vida en comunas, música rock y folk. Hitos: Verano del Amor (1967) y Woodstock (1969).</div>
<div><b>Ecologista</b>Rachel Carson denuncia los pesticidas (DDT) en <i>Primavera silenciosa</i> (1962). Primer Día de la Tierra (1970). Greenpeace (1971) nace protestando contra pruebas nucleares.</div>
<div><b>Anticomunista</b>Macartismo en EE. UU. (1950-1954); en América Latina, apoyo a gobiernos y dictaduras anticomunistas.</div>
<div><b>Antinuclear / pacifista</b>Campaña por el Desarme Nuclear (CND, Reino Unido, 1958), cuyo emblema es el actual <b>símbolo de la paz</b>; marchas contra las pruebas atómicas.</div>
<div><b>Liberación de la mujer</b>“Segunda ola” feminista: Simone de Beauvoir (<i>El segundo sexo</i>, 1949) y Betty Friedan (<i>La mística de la feminidad</i>, 1963). Luchas por igualdad salarial, educación, empleo y derechos reproductivos.</div>
<div><b>Movimiento gay (LGBT)</b>Disturbios de <b>Stonewall</b> (Nueva York, 28 de junio de 1969) contra redadas policiales; origen de las marchas del <b>Orgullo</b> (1970).</div>
<div><b>Antiglobalización</b>Critica el poder de las multinacionales y organismos como la OMC y el FMI. Protestas de <b>Seattle (1999)</b> y Foro Social Mundial (2001): “<i>Otro mundo es posible</i>”.</div>
</div>
<div class="callout link"><b class="t">Relación con la Guerra Fría</b>La amenaza nuclear, la guerra de Vietnam y la sociedad de consumo fueron el “combustible” de estos movimientos juveniles de protesta.</div>` },

T7: { short: 'Descolonización y Primavera Árabe', title: 'Descolonización en África y Asia, Primavera Árabe e India-Pakistán hoy', icon: '🌍', ae: 1, html: `
<p><b>Descolonización:</b> proceso por el cual las colonias de Asia y África obtuvieron su independencia, principalmente entre 1945 y 1975.</p>
<h3>Causas</h3>
<ul>
<li>Debilitamiento de las potencias europeas tras la Segunda Guerra Mundial.</li>
<li>Crecimiento de los nacionalismos y líderes independentistas.</li>
<li>La ONU defendió la <b>autodeterminación de los pueblos</b>; EE. UU. y la URSS apoyaban la independencia buscando nuevos aliados.</li>
<li>Conferencia de Bandung (1955) → <b>Movimiento de Países No Alineados</b> (1961): el “Tercer Mundo”.</li>
</ul>
<div class="tbl-wrap"><table>
<thead><tr><th>País</th><th>Metrópoli</th><th>Independencia</th><th>Claves</th></tr></thead>
<tbody>
<tr><td><b>India</b></td><td>Reino Unido</td><td>1947</td><td><b>Gandhi</b>: resistencia no violenta y desobediencia civil (Marcha de la Sal, 1930). <b>Nehru</b>, primer ministro.</td></tr>
<tr><td><b>Pakistán</b></td><td>Reino Unido</td><td>1947</td><td><b>Jinnah</b> (Liga Musulmana). Partición: India de mayoría hindú y Pakistán de mayoría musulmana; más de 10 millones de desplazados y enorme violencia. En 1971 Pakistán Oriental se convierte en <b>Bangladesh</b>.</td></tr>
<tr><td><b>Siria</b></td><td>Francia (mandato)</td><td>1946</td><td>Las tropas francesas se retiran en abril de 1946.</td></tr>
<tr><td><b>Libia</b></td><td>Italia</td><td>1951</td><td>Tras la guerra la administraron británicos y franceses; la ONU impulsó su independencia como reino (Idris I). En 1969, golpe de Muamar el Gadafi.</td></tr>
<tr><td><b>Túnez</b></td><td>Francia (protectorado)</td><td>1956</td><td>Liderada por <b>Habib Burguiba</b>.</td></tr>
</tbody></table></div>
<h3>La Primavera Árabe (2010-2012)</h3>
<ul>
<li><b>Qué fue:</b> ola de protestas en países árabes contra regímenes autoritarios.</li>
<li><b>Causas:</b> autoritarismo, corrupción, desempleo juvenil, pobreza y falta de libertades.</li>
<li><b>Detonante:</b> el vendedor tunecino <b>Mohamed Bouazizi</b> se inmoló el 17 de diciembre de 2010. Las redes sociales difundieron las protestas.</li>
<li><b>Resultados:</b> caen Ben Alí (Túnez, 2011), Mubarak (Egipto, 2011) y Gadafi (Libia, 2011). En <b>Siria</b> y Yemen se desataron guerras civiles. Túnez tuvo la transición más democrática, aunque con retrocesos posteriores.</li>
</ul>
<h3>Tensiones entre India y Pakistán en la actualidad</h3>
<ul>
<li>Raíz: la disputa por <b>Cachemira</b>, sin resolver desde la partición de 1947.</li>
<li>Guerras en 1947, 1965, 1971 y el conflicto de Kargil (1999).</li>
<li>Ambos son <b>potencias nucleares</b> desde 1998, lo que hace cualquier crisis muy peligrosa.</li>
<li>2019: atentado de Pulwama, ataques aéreos y fin de la autonomía especial de la Cachemira india. 2025: tras un atentado en Pahalgam hubo nuevos ataques militares mutuos y luego un alto al fuego.</li>
</ul>` },

T8: { short: 'Derechos civiles en EE. UU.', title: 'Lucha por los derechos civiles de la población afroamericana (años 60)', icon: '🕊️', ae: 3, html: `
<p><b>Contexto:</b> en el sur de EE. UU. regían las <b>leyes Jim Crow</b> (“separados pero iguales”): segregación en escuelas, buses y restaurantes, trabas para votar y violencia de grupos como el Ku Klux Klan.</p>

<thead><tr><th>Año</th><th>Hecho</th></tr></thead>

<tr><td>1955-1956</td><td><b>Rosa Parks</b> se niega a ceder su asiento a un blanco → <b>boicot de autobuses de Montgomery</b> (381 días), liderado por Martin Luther King.</td></tr>
<tr><td>1957</td><td>Los “Nueve de Little Rock” integran una escuela bajo protección federal.</td></tr>
<tr><td>1960-1961</td><td>Sentadas de Greensboro y “Viajeros de la Libertad”.</td></tr>
<tr><td>1963</td><td><b>Marcha sobre Washington</b>: discurso “<i>Tengo un sueño</i>”.</td></tr>

<tr><td>1965</td><td>Marchas de Selma a Montgomery y <b>Ley de Derecho al Voto</b>. Asesinato de Malcolm X.</td></tr>

function progress(){
  const learn = Math.min(S.read.length, TOPIC_IDS.length) / TOPIC_IDS.length * 20;
  return Math.round(learn + (S.best.k + S.best.a + S.best.r + S.best.exam) / 100 * 20);
}
function ringSVG(p, c, label, sub){
  const R = 70, C = 2 * Math.PI * R;
  return `<div class="ring" style="--c:${c}" role="img" aria-label="${esc(label)}: ${p} de 100">
    <svg viewBox="0 0 168 168" aria-hidden="true"><circle class="track" cx="84" cy="84" r="${R}"/><circle class="val" cx="84" cy="84" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${C * (1 - p / 100)}"/></svg>
    <div class="lbl" aria-hidden="true"><div><b>${p}</b><small>${esc(sub)}</small></div></div></div>`;
}
function animateRings(){ requestAnimationFrame(() => requestAnimationFrame(() => $$('.ring .val').forEach(c => c.style.strokeDashoffset = c.dataset.off))); }
function topicMastery(t){ const s = S.topic[t]; return s && s.tot ? Math.round(s.got / s.tot * 100) : null; }

/* =========================================================
   MOTOR DE PRÁCTICA
   ========================================================= */
let Q = null;
const OK_MSGS = ['¡Correcto!', '¡Muy bien!', '¡Excelente!', '¡Así se hace!', '¡Lo dominas!'];

function startQuiz(opts){
  Q = Object.assign({ i: 0, results: [], streak: 0, bestStreak: 0 }, opts);
  if (Q.mode === 'exam') {
    timer = setInterval(() => { const el = $('#timer'); if (el) { const s = Math.floor((Date.now() - Q.t0) / 1000); el.textContent = '⏱ ' + String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); } }, 1000);
  }
  renderItem();
}

function renderItem(){
  const it = Q.items[Q.i], n = Q.items.length, exam = Q.mode === 'exam';
  const lv = LEVELS[it.lv];
  const newPart = exam && (Q.i === 0 || Q.items[Q.i - 1].part !== it.part);
  setView(`
  <section aria-labelledby="qh">
    <div class="quiz-top">
      <a class="btn ghost sm" href="${Q.back || '#/'}" id="exitBtn">← Salir</a>
      <div class="qprog"><div class="minibar" style="--c:${Q.c}"><span style="width:${(Q.i) / n * 100}%"></span></div><small>Ítem ${Q.i + 1} de ${n}</small></div>
      ${exam ? '<span class="pill" id="timer" aria-label="Tiempo transcurrido">⏱ 00:00</span>' : `<span class="pill" title="Racha de aciertos" aria-label="Racha de ${Q.streak} aciertos">🔥 ${Q.streak}</span>`}
    </div>
    ${exam && it.part ? `<div class="card part-head" ${newPart ? '' : 'style="padding:8px 18px"'}><h2 id="qh">${esc(it.part)}</h2>${newPart ? `<p>${esc(it.partDesc)}</p>` : ''}</div>` : `<h2 id="qh" class="sr-only">${esc(Q.title)}: ítem ${Q.i + 1}</h2>`}
    <article class="card qcard" style="--c:${lv.c}">
      <div class="chips"><span class="chip" style="--c:${lv.c}">${lv.icon} ${esc(lv.short)}</span><span class="chip" style="--c:var(--lv0)">${TOPICS[it.t].icon} ${esc(TOPICS[it.t].short)}</span><span class="chip neutral">${esc(TYPE_LABEL[it.type])} · ${it.pts} pt${it.pts > 1 ? 's' : ''}</span></div>
      <div id="qbody"></div>
      <div id="fb" class="feedback" tabindex="-1"></div>
      <div class="actions"><button class="btn primary" style="--c:${lv.c}" id="checkBtn" disabled>${exam ? (Q.i === n - 1 ? 'Entregar examen' : 'Guardar y continuar →') : 'Comprobar'}</button></div>
    </article>
  </section>`);
  if (exam && timer) { const s = Math.floor((Date.now() - Q.t0) / 1000); $('#timer').textContent = '⏱ ' + String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
  const btn = $('#checkBtn');
  const ctl = RENDER[it.type](it, $('#qbody'), () => { btn.disabled = !ctl.ready(); }, exam);
  $('#exitBtn').onclick = e => { if (Q.i > 0 && !confirm('¿Salir? Se perderá el avance de esta ronda.')) e.preventDefault(); };
  let checked = false;
  btn.onclick = () => {
    if (!checked) {
      checked = true;
      const html = ctl.check();
      if (exam) { record(it, ctl, html); return advance(); }
      const fb = $('#fb'); fb.innerHTML = html; ctl.after && ctl.after(fb);
      const sc = ctl.score();
      Q.streak = sc >= 1 ? Q.streak + 1 : 0; Q.bestStreak = Math.max(Q.bestStreak, Q.streak);
      announce(sc >= 1 ? 'Respuesta correcta.' : sc > 0 ? 'Respuesta parcialmente correcta.' : 'Respuesta incorrecta. Lee la explicación.');
      btn.textContent = Q.i === n - 1 ? 'Ver resultados' : 'Siguiente →';
      fb.focus({ preventScroll: true }); fb.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'nearest' });
      if (sc >= 1 && Q.streak > 0 && Q.streak % 5 === 0) toast('🔥 ¡Racha de ' + Q.streak + ' aciertos!');
      return;
    }
    record(it, ctl, $('#fb').innerHTML);
    advance();
  };
}
function record(it, ctl, html){
  // En revisión final se muestran los criterios sin posibilidad de edición
  Q.results.push({ it, frac: Math.max(0, Math.min(1, ctl.score())), html: html.replace(/<input /g, '<input disabled ') });
}
function advance(){ Q.i++; if (Q.i < Q.items.length) { renderItem(); window.scrollTo(0, 0); focusMain(); } else finish(); }

function feedbackBlock(it, frac, inner){
  const st = frac >= 1 ? 'ok' : frac > 0 ? 'partial' : 'bad';
  const title = st === 'ok' ? OK_MSGS[Math.floor(Math.random() * OK_MSGS.length)] : st === 'partial' ? 'Parcialmente correcto' : 'Aún no… revisemos juntos';
  return `<div class="fb ${st}"><div class="fb-head"><span class="fb-icon" aria-hidden="true">${st === 'ok' ? '✓' : st === 'partial' ? '◐' : '✗'}</span><strong class="fb-title">${title}</strong><span class="fb-pts">${fmt(frac * it.pts)} / ${it.pts} pts</span></div>
    ${inner}${it.exp ? `<div class="fb-exp"><b>Explicación:</b> ${esc(it.exp)}</div>` : ''}${it.tip ? `<div class="fb-tip">💡 <b>Para recordar:</b> ${esc(it.tip)}</div>` : ''}</div>`;
}
const srcHTML = it => it.src ? `<blockquote class="source"><span class="tag">${esc(it.src.tag)}</span>${esc(it.src.text)}<cite>${esc(it.src.cite)}</cite></blockquote>` : '';

/* ---------- Renderizadores por tipo de ítem ---------- */
const RENDER = {
  mcq(it, el, onChange){
    const opts = it.fixed ? it.o : shuffle(it.o), name = 'o' + uid(), qid = 'q' + uid();
    el.innerHTML = `${srcHTML(it)}<fieldset class="opts" role="radiogroup" aria-labelledby="${qid}"><legend class="q" id="${qid}">${esc(it.q)}</legend>
      ${opts.map((o, i) => `<label class="opt"><input type="radio" name="${name}" value="${i}"><span class="letter" aria-hidden="true">${'abcd'[i]}</span><span>${esc(o.x)}</span></label>`).join('')}</fieldset>`;
    let sel = -1, fr = 0;
    $$('input', el).forEach(inp => inp.addEventListener('change', () => { sel = +inp.value; onChange(); }));
    return {
      ready: () => sel >= 0,
      check(){
        const o = opts[sel], right = opts.find(x => x.ok); fr = o.ok ? 1 : 0;
        el.querySelector('fieldset').classList.add('locked');
        $$('input', el).forEach(i => i.disabled = true);
        $$('.opt', el).forEach((lab, i) => { if (opts[i].ok) lab.classList.add('is-ok'); else if (i === sel) lab.classList.add('is-bad'); });
        const inner = `<p><b>Tu respuesta:</b> ${esc(o.x)}</p>${o.fb ? `<p class="why">${esc(o.fb)}</p>` : ''}${!o.ok ? `<p><b>Respuesta correcta:</b> ${esc(right.x)}</p>${right.fb ? `<p class="why">${esc(right.fb)}</p>` : ''}` : ''}`;
        return feedbackBlock(it, fr, inner);
      },
      score: () => fr
    };
  },
  tf(it, el, onChange){
    const proxy = Object.create(it);
    proxy.fixed = true;
    proxy.q = 'Enunciado: ' + it.q;
    proxy.o = [ { x:'Verdadero', ok: it.ans === true }, { x:'Falso', ok: it.ans === false } ];
    return RENDER.mcq(proxy, el, onChange);
  },
  match(it, el, onChange){
    const L = 'ABCDEFGH', id = uid();
    const right = shuffle(it.pairs.map((p, i) => ({ x: p[1], i })));
    el.innerHTML = `${srcHTML(it)}<p class="q">${esc(it.q)}</p><div class="match">
      <div class="colA"><h4>Columna A</h4><ol>${it.pairs.map((p, i) => `<li class="mrow" data-i="${i}"><label for="m${id}${i}">${i + 1}. ${esc(p[0])}</label>
        <select id="m${id}${i}" data-i="${i}"><option value="">Elija una letra…</option>${right.map((r, k) => `<option value="${k}">${L[k]}) ${esc(r.x.length > 70 ? r.x.slice(0, 68) + '…' : r.x)}</option>`).join('')}</select></li>`).join('')}</ol></div>
      <div class="colB"><h4>Columna B</h4><ul>${right.map((r, k) => `<li><b>${L[k]})</b>${esc(r.x)}</li>`).join('')}</ul></div></div>`;
    const sels = $$('select', el); let fr = 0;
    sels.forEach(s => s.addEventListener('change', onChange));
    return {
      ready: () => sels.every(s => s.value !== ''),
      check(){
        let ok = 0; const lines = [];
        sels.forEach(s => {
          const i = +s.dataset.i, k = +s.value, good = right[k].i === i; s.disabled = true;
          if (good) ok++;
          s.closest('.mrow').classList.add(good ? 'is-ok-row' : 'is-bad-row');
          lines.push(`<li class="${good ? 'okc' : 'badc'}"><b>${esc(it.pairs[i][0])}</b> → ${esc(it.pairs[i][1])}${good ? '' : ` <span class="muted">(elegiste ${L[k]}: “${esc(right[k].x)}”)</span>`}</li>`);
        });
        fr = ok / sels.length;
        return feedbackBlock(it, fr, `<p><b>${ok} de ${sels.length}</b> relaciones correctas.</p><ul>${lines.join('')}</ul>`);
      },
      score: () => fr
    };
  },
  order(it, el, onChange){
    const n = it.items.length;
    let cur = shuffle([...Array(n).keys()]);
    while (n > 1 && cur.every((v, i) => v === i)) cur = shuffle(cur);
    let locked = false, fr = 0;
    el.innerHTML = `${srcHTML(it)}<p class="q" id="oq${n}">${esc(it.q)}</p><p class="muted" style="font-size:.9rem;margin-top:-6px">Usa las flechas ↑ ↓ para mover cada hecho. El número 1 es el más antiguo.</p><ol class="olist" aria-label="Lista para ordenar"></ol>`;
    const list = el.querySelector('.olist');
    const draw = (focusIdx, dir) => {
      list.innerHTML = cur.map((v, pos) => `<li class="oitem${pos === focusIdx ? ' flash' : ''}" data-pos="${pos}"><span class="num" aria-hidden="true">${pos + 1}</span><span>${esc(it.items[v][0])}</span>
        ${locked ? '' : `<span class="mv"><button type="button" data-a="up" data-p="${pos}" aria-label="Subir: ${esc(it.items[v][0])}" ${pos === 0 ? 'disabled' : ''}>↑</button><button type="button" data-a="dn" data-p="${pos}" aria-label="Bajar: ${esc(it.items[v][0])}" ${pos === n - 1 ? 'disabled' : ''}>↓</button></span>`}</li>`).join('');
      if (focusIdx != null && !locked) {
        let b = list.querySelector(`button[data-p="${focusIdx}"][data-a="${dir}"]`);
        if (!b || b.disabled) b = list.querySelector(`button[data-p="${focusIdx}"]:not([disabled])`);
        b && b.focus();
      }
    };
    list.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b || locked) return;
      const p = +b.dataset.p, q = b.dataset.a === 'up' ? p - 1 : p + 1;
      if (q < 0 || q >= n) return;
      [cur[p], cur[q]] = [cur[q], cur[p]];
      draw(q, b.dataset.a);
      announce(`${it.items[cur[q]][0]} movido a la posición ${q + 1}.`);
    });
    draw(); setTimeout(onChange);
    return {
      ready: () => true,
      check(){
        locked = true; draw();
        let ok = 0;
        $$('.oitem', list).forEach((li, pos) => { const good = cur[pos] === pos; if (good) ok++; li.classList.add(good ? 'is-ok-row' : 'is-bad-row'); });
        fr = ok / n;
        return feedbackBlock(it, fr, `<p><b>${ok} de ${n}</b> posiciones correctas. Orden correcto:</p><ol>${it.items.map((x, i) => `<li class="${cur[i] === i ? 'okc' : 'badc'}"><b>${esc(x[1])}</b> · ${esc(x[0])}</li>`).join('')}</ol>`);
      },
      score: () => fr
    };
  },
  classify(it, el, onChange){
    const rows = shuffle(it.items.map((x, i) => ({ x: x[0], c: x[1], i })));
    const id = uid(); let fr = 0;
    el.innerHTML = `${srcHTML(it)}<p class="q">${esc(it.q)}</p><div class="clist">${rows.map((r, k) => `<fieldset class="crow" data-k="${k}"><legend class="ct">${esc(r.x)}</legend><div class="seg">
      ${it.cats.map((c, ci) => `<label><input type="radio" name="c${id}${k}" value="${ci}"><span>${esc(c)}</span></label>`).join('')}</div></fieldset>`).join('')}</div>`;
    const val = k => { const r = el.querySelector(`input[name="c${id}${k}"]:checked`); return r ? +r.value : -1; };
    $$('input', el).forEach(i => i.addEventListener('change', onChange));
    return {
      ready: () => rows.every((_, k) => val(k) >= 0),
      check(){
        let ok = 0; const lines = [];
        rows.forEach((r, k) => {
          const v = val(k), good = v === r.c; if (good) ok++;
          el.querySelector(`.crow[data-k="${k}"]`).classList.add(good ? 'is-ok-row' : 'is-bad-row');
          lines.push(`<li class="${good ? 'okc' : 'badc'}">${esc(r.x)} → <b>${esc(it.cats[r.c])}</b>${good ? '' : ` <span class="muted">(elegiste: ${esc(it.cats[v])})</span>`}</li>`);
        });
        $$('input', el).forEach(i => i.disabled = true);
        fr = ok / rows.length;
        return feedbackBlock(it, fr, `<p><b>${ok} de ${rows.length}</b> clasificaciones correctas.</p><ul>${lines.join('')}</ul>`);
      },
      score: () => fr
    };
  },
  short(it, el, onChange){
    const id = 's' + uid(); let fr = 0;
    el.innerHTML = `${srcHTML(it)}<label class="q" for="${id}" style="display:block">${esc(it.q)}</label><input type="text" id="${id}" autocomplete="off" spellcheck="true" placeholder="Escribe tu respuesta…">`;
    const inp = $('#' + id, el);
    inp.addEventListener('input', onChange);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && inp.value.trim()) { e.preventDefault(); $('#checkBtn').click(); } });
    return {
      ready: () => inp.value.trim().length > 0,
      check(){
        const v = norm(inp.value); fr = it.acc.some(a => v.includes(norm(a))) ? 1 : 0;
        inp.disabled = true; inp.classList.add(fr ? 'is-ok-row' : 'is-bad-row');
        return feedbackBlock(it, fr, `<p><b>Tu respuesta:</b> ${esc(inp.value)}</p><p><b>Respuesta esperada:</b> ${esc(it.ans)}</p>${fr ? '' : '<p class="why">Revisa la ortografía del nombre o concepto: en el examen, la precisión cuenta.</p>'}`);
      },
      score: () => fr
    };
  },
  essay(it, el, onChange, exam){
    const id = 'e' + uid(); let fr = 0, marks = [];
    el.innerHTML = `${srcHTML(it)}<label class="q" for="${id}" style="display:block">${esc(it.q)}</label>
      <p class="muted" style="font-size:.9rem;margin-top:-6px">Escribe al menos un párrafo. Usa conceptos del tema, fechas y ejemplos concretos.</p>
      <textarea id="${id}" placeholder="Desarrolla tu respuesta aquí…"></textarea><div class="counter" aria-live="off"><span>0</span> palabras</div>`;
    const ta = $('#' + id, el), cnt = el.querySelector('.counter span');
    const words = () => (ta.value.trim().match(/\S+/g) || []).length;
    ta.addEventListener('input', () => { cnt.textContent = words(); onChange(); });
    const levelName = f => f >= .99 ? 'Avanzado' : f >= .5 ? 'Intermedio' : 'Inicial';
    return {
      ready: () => words() >= 12,
      check(){
        const v = norm(ta.value);
        marks = it.keys.map(k => k.kw.some(w => v.includes(norm(w))));
        fr = marks.filter(Boolean).length / marks.length;
        ta.disabled = true;
        const rub = it.keys.map((k, i) => `<label><input type="checkbox" data-r="${i}" ${marks[i] ? 'checked' : ''}><span>${esc(k.c)}</span></label>`).join('');
        return feedbackBlock(it, fr, `
          <p><b>Tu respuesta:</b></p><div class="yours">${esc(ta.value)}</div>
          <p><b>Criterios de la rúbrica</b> ${exam ? '(detectados automáticamente, calificación orientativa)' : '— marcados según las ideas detectadas en tu texto. <b>Compara con la respuesta modelo y ajusta con honestidad</b>: la autoevaluación también es aprendizaje.'}</p>
          <div class="rubric">${rub}</div>
          <p>Nivel de desempeño: <span class="level-tag">${levelName(fr)}</span></p>
          <div class="model"><b>Respuesta modelo:</b> ${esc(it.model)}</div>`);
      },
      after(fbEl){
        $$('input[type=checkbox]', fbEl).forEach(cb => cb.addEventListener('change', () => {
          marks[+cb.dataset.r] = cb.checked;
          fr = marks.filter(Boolean).length / marks.length;
          const box = fbEl.querySelector('.fb');
          box.className = 'fb ' + (fr >= 1 ? 'ok' : fr > 0 ? 'partial' : 'bad');
          box.querySelector('.fb-pts').textContent = `${fmt(fr * it.pts)} / ${it.pts} pts`;
          box.querySelector('.fb-icon').textContent = fr >= 1 ? '✓' : fr > 0 ? '◐' : '✗';
          box.querySelector('.fb-title').textContent = fr >= 1 ? '¡Respuesta completa!' : fr > 0 ? 'Parcialmente logrado' : 'Aún no logrado';
          box.querySelector('.level-tag').textContent = levelName(fr);
          $$('input[type=checkbox]', fbEl).forEach((c, i) => c.toggleAttribute('checked', marks[i]));
        }));
      },
      score: () => fr
    };
  }
};

/* ---------- Resultados ---------- */
function finish(){
  clearInterval(timer); timer = null;
  const R = Q.results;
  const tot = R.reduce((a, r) => a + r.it.pts, 0), got = R.reduce((a, r) => a + r.frac * r.it.pts, 0);
  const score = tot ? Math.round(got / tot * 100) : 0;
  const prevBest = Q.key ? S.best[Q.key] : 0;
  if (Q.key) { S.tries[Q.key]++; S.best[Q.key] = Math.max(S.best[Q.key], score); }
  const per = {};
  R.forEach(r => {
    const t = r.it.t; (per[t] = per[t] || { got: 0, tot: 0 });
    per[t].got += r.frac * r.it.pts; per[t].tot += r.it.pts;
    const s = (S.topic[t] = S.topic[t] || { got: 0, tot: 0 }); s.got += r.frac * r.it.pts; s.tot += r.it.pts;
    const id = r.it.id;
    if (r.frac < 1) { if (!S.missed.includes(id)) S.missed.push(id); }
    else S.missed = S.missed.filter(x => x !== id);
  });
  save();
  const lvl = levelOf(score);
  const weak = Object.entries(per).filter(([, v]) => v.got / v.tot < .7).map(([t]) => t);
  const time = Q.t0 ? Math.round((Date.now() - Q.t0) / 60000) : null;
  const st = f => f >= 1 ? 'ok' : f > 0 ? 'partial' : 'bad';
  setView(`
  <section class="card" aria-labelledby="rh">
    <div class="res-head">
      ${ringSVG(score, score >= 70 ? 'var(--ok)' : score >= 50 ? 'var(--part)' : 'var(--bad)', 'Nota', 'de 100')}
      <div>
        <p class="eyebrow">${esc(Q.title)}</p>
        <h1 id="rh">${score >= 90 ? '¡Extraordinario!' : score >= 70 ? '¡Aprobado! Buen trabajo' : score >= 50 ? 'Vas por buen camino' : 'Cada intento suma'}</h1>
        <p>Obtuviste <b>${fmt(got)} de ${tot} puntos</b>${time != null ? ` en ${time} min` : ''}. Nivel de desempeño: <span class="level-tag">${lvl.n}</span></p>
        <p class="muted">${esc(lvl.d)}</p>
        ${Q.key && score > prevBest && S.tries[Q.key] > 1 ? `<p><b>🎉 ¡Nuevo récord personal!</b> (antes: ${prevBest})</p>` : ''}
        ${Q.bestStreak >= 3 ? `<p>🔥 Mejor racha: <b>${Q.bestStreak}</b> aciertos seguidos</p>` : ''}
      </div>
    </div>
  </section>

  <div class="grid g2" style="margin-top:16px">
    <section class="card"><h2 style="font-size:1.2rem">Resultado por tema</h2><div class="mastery">
      ${Object.entries(per).map(([t, v]) => { const p = Math.round(v.got / v.tot * 100); return `<a class="m" href="#/tema/${t}" style="--c:${p >= 70 ? 'var(--ok)' : p >= 50 ? 'var(--part)' : 'var(--bad)'}"><span class="n">${TOPICS[t].icon} ${esc(TOPICS[t].short)}</span><span class="v">${p}%</span><span class="minibar"><span style="width:${p}%"></span></span></a>`; }).join('')}
    </div></section>
    <section class="card"><h2 style="font-size:1.2rem">Plan de mejora</h2>
      ${weak.length ? `<p>Te recomendamos repasar:</p><ul>${weak.map(t => `<li><a href="#/tema/${t}">${esc(TOPICS[t].title)}</a></li>`).join('')}</ul><p class="muted" style="font-size:.9rem">Los ítems fallados quedaron guardados en <a href="#/errores">Reforzar mis errores</a>.</p>`
        : '<p>¡Superaste el 70 % en todos los temas evaluados! Sube de nivel o intenta el simulacro.</p>'}
    </section>
  </div>

  <section style="margin-top:16px" class="review" aria-labelledby="rv">
    <h2 id="rv" style="font-size:1.2rem">Revisión ítem por ítem</h2>
    ${R.map((r, i) => `<details${r.frac < 1 && Q.mode === 'exam' ? '' : ''}><summary><span class="st ${st(r.frac)}" aria-hidden="true">${r.frac >= 1 ? '✓' : r.frac > 0 ? '◐' : '✗'}</span><span class="sq"><span class="sr-only">${r.frac >= 1 ? 'Correcto' : r.frac > 0 ? 'Parcial' : 'Incorrecto'}: </span>${i + 1}. ${esc(r.it.q)}</span><span class="sp">${fmt(r.frac * r.it.pts)}/${r.it.pts}</span></summary><div class="body">${r.html}</div></details>`).join('')}
  </section>

  <div class="actions">
    <a class="btn ghost" href="#/">Inicio</a>
    ${Q.back ? `<a class="btn ghost" href="${Q.back}">Volver al tema</a>` : ''}
    <button class="btn primary" style="--c:${Q.c}" id="againBtn">Intentar de nuevo</button>
    ${Q.key && Q.key !== 'exam' && score >= 70 ? `<a class="btn primary" style="--c:var(--exam)" href="${Q.key === 'k' ? '#/nivel/a' : Q.key === 'a' ? '#/nivel/r' : '#/examen'}">Siguiente paso →</a>` : ''}
  </div>`);
  animateRings();
  if (score >= 70) confetti();
  announce(`Resultado: ${score} de 100. Nivel ${lvl.n}.`);
  const again = Q.key === 'exam' ? examIntro : Q.key ? () => levelIntro(Q.key) : Q.back ? () => startTopicQuiz(Q.back.split('/').pop()) : startMissed;
  $('#againBtn').onclick = () => { again(); window.scrollTo(0, 0); focusMain(); };
}

function confetti(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div'); box.className = 'confetti'; box.setAttribute('aria-hidden', 'true');
  const cols = ['var(--lv1)', 'var(--lv2)', 'var(--lv3)', 'var(--exam)', 'var(--lv0)'];
  for (let i = 0; i < 70; i++) { const c = document.createElement('i'); c.style.left = Math.random() * 100 + '%'; c.style.background = cols[i % cols.length]; c.style.animationDelay = Math.random() * .8 + 's'; c.style.transform = `rotate(${Math.random() * 360}deg)`; box.appendChild(c); }
  document.body.appendChild(box); setTimeout(() => box.remove(), 3800);
}

/* ---------- Tarjetas ---------- */
function cardsView(filter){
  const f = filter || 'all';
  const list = CARDS.filter(c => f === 'all' || c[2] === f);
  setView(`
  <p><a class="btn ghost sm" href="#/">← Inicio</a></p>
  <h1>🃏 Tarjetas de conceptos</h1>
  <p class="muted">Lee el término, intenta definirlo en voz alta y luego voltea la tarjeta (clic, Enter o Espacio) para comprobar.</p>
  <div class="filters" role="group" aria-label="Filtrar por tema">
    <button aria-pressed="${f === 'all'}" data-f="all">Todas</button>
    ${TOPIC_IDS.map(t => `<button aria-pressed="${f === t}" data-f="${t}">${TOPICS[t].icon} ${esc(TOPICS[t].short)}</button>`).join('')}
  </div>
  <div class="row" style="margin-bottom:12px"><button class="btn ghost sm" id="shuf">🔀 Mezclar</button><button class="btn ghost sm" id="flipAll">Voltear todas</button></div>
  <div class="flash-grid" id="fg"></div>`);
  const draw = arr => {
    $('#fg').innerHTML = arr.map(c => `<button class="fc" aria-pressed="false" style="--c:var(--lv${['T1','T2','T3'].includes(c[2]) ? 1 : ['T4','T5'].includes(c[2]) ? 2 : 3})" aria-label="${esc(c[0])}. Voltear para ver la definición">
      <span class="inner"><span class="face front"><b>${esc(c[0])}</b><small>${esc(TOPICS[c[2]].short)} · toca para voltear</small></span><span class="face back" aria-hidden="true">${esc(c[1])}</span></span></button>`).join('');
    $$('.fc').forEach(b => b.onclick = () => flip(b));
  };
  const flip = (b, v) => {
    const on = v != null ? v : b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', on); b.querySelector('.back').setAttribute('aria-hidden', !on);
    if (v == null && on) announce(b.querySelector('.back').textContent);
  };
  draw(list);
  $$('.filters button').forEach(b => b.onclick = () => { cardsView(b.dataset.f); $(`.filters [data-f="${b.dataset.f}"]`).focus(); });
  $('#shuf').onclick = () => draw(shuffle(list));
  let all = false; $('#flipAll').onclick = () => { all = !all; $$('.fc').forEach(b => flip(b, all)); };
}

/* ---------- Línea de tiempo ---------- */
function timelineView(){
  setView(`
  <p><a class="btn ghost sm" href="#/">← Inicio</a></p>
  <h1>🗓️ Línea de tiempo</h1>
  <p class="muted">Ubica cada hecho en su fase. En el examen, la cronología te ayuda a descartar opciones incorrectas.</p>
  ${PHASES.map((ph, pi) => `
    <div class="phase-title"><h2 style="color:${ph.c}">${esc(ph.n)}</h2><span class="chip" style="--c:${ph.c}">${ph.r}</span></div>
    <ol class="tl">${EVENTS.filter(e => e[0] === pi).map(e => `<li style="--c:${ph.c}"><div class="card ev"><span class="yr">${e[1]}</span>${esc(e[2])}</div></li>`).join('')}</ol>`).join('')}
  <div class="actions"><a class="btn primary" style="--c:var(--lv1)" href="#/practica/T3">Practicar fases →</a></div>`);
}

/* =========================================================
   ROUTER, TEMA Y TAMAÑO DE LETRA
   ========================================================= */
const routes = [
  [/^#?\/?$/, home],
  [/^#\/guia$/, guideIndex],
  [/^#\/tema\/(T\d)$/, m => topicView(m[1])],
  [/^#\/nivel\/([kar])$/, m => levelIntro(m[1])],
  [/^#\/practica\/(T\d)$/, m => startTopicQuiz(m[1])],
  [/^#\/examen$/, examIntro],
  [/^#\/errores$/, startMissed],
  [/^#\/tarjetas$/, () => cardsView()],
  [/^#\/linea$/, timelineView]
];
function router(){
  clearInterval(timer); timer = null;
  const h = location.hash || '#/';
  const r = routes.find(([re]) => re.test(h));
  r ? r[1](h.match(r[0])) : home();
  window.scrollTo(0, 0); focusMain();
}
window.addEventListener('hashchange', router);

function applyTheme(){
  const root = document.documentElement;
  if (S.theme === 'auto') root.removeAttribute('data-theme'); else root.dataset.theme = S.theme;
  root.style.setProperty('--fs', S.fs);
  const lbl = { auto:'automático', light:'claro', dark:'oscuro' }[S.theme];
  const tb = $('#themeBtn'); tb.textContent = { auto:'◐', light:'☀', dark:'☾' }[S.theme]; tb.setAttribute('aria-label', 'Tema de color: ' + lbl + '. Cambiar');
  tb.title = 'Tema: ' + lbl;
}
$('#themeBtn').onclick = () => { S.theme = { auto:'light', light:'dark', dark:'auto' }[S.theme] || 'auto'; save(); applyTheme(); toast('Tema ' + { auto:'automático', light:'claro', dark:'oscuro' }[S.theme]); };
$('#fsUp').onclick = () => { S.fs = Math.min(1.3, +(S.fs + .1).toFixed(2)); save(); applyTheme(); };
$('#fsDown').onclick = () => { S.fs = Math.max(.9, +(S.fs - .1).toFixed(2)); save(); applyTheme(); };

applyTheme();
router();
</script>
</body>
