.world-card{
  border:4px solid #000; padding:14px; cursor:pointer; position:relative;
  box-shadow: inset -6px -6px 0 rgba(0,0,0,.35), inset 6px 6px 0 rgba(255,255,255,.1), 5px 5px 0 #000;

.world-card:active{ transform:translate(2px,2px); box-shadow:2px 2px 0 #000; }
.world-card .emoji{ font-size:34px; }

.world-card p{ margin:0; font-size:18px; color:#eee; }
.world-card .stat{ margin-top:8px; font-size:16px; color:var(--gold); }

.card-actions{ display:flex; gap:8px; margin-top:12px; }

.option{
  display:block; width:100%; text-align:left; font-family:'VT323',monospace; font-size:22px;

}
.option:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 #000; }
.option.correct{ background:var(--ok) !important; color:#04270b; }
.option.incorrect{ background:var(--bad) !important; color:#2a0000; animation:shake .3s; }
.option.disabled{ pointer-events:none; opacity:.85; }
@keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

.qbox{ font-size:24px; line-height:1.5; margin-bottom:16px; background:#000; padding:14px; border:3px solid #000;}
.explain{ background:#1c3a1c; border:3px solid #000; padding:12px; margin:10px 0 16px; font-size:19px; color:#d4ffd4;}
.explain.bad{ background:#3a1c1c; color:#ffd4d4; }

.center{ text-align:center; }
.small{ font-size:16px; opacity:.85; }
.mt{ margin-top:16px; }
.row{ display:flex; gap:10px; }
.row > *{ flex:1; }

.review-item{ border:3px solid #000; padding:10px; margin-bottom:10px; font-size:18px; background:#241f33; }
.review-item.wrong{ background:#3a1c1c; }
.review-item.right{ background:#1c3a1c; }
.review-item .tag{ font-family:'Press Start 2P',monospace; font-size:9px; color:var(--gold); }

::-webkit-scrollbar{ width:10px; }
::-webkit-scrollbar-thumb{ background:#555; }

.footer-nav{ position:sticky; bottom:0; margin-top:20px; }

const EXAM_PLAN = {rusia:6, crisis29:6, wwiiAnte:8, wwiiCausas:6, wwiiFases:6, wwiiConf:8};

/* ================= ESTADO ================= */
let state = {
  screen:'home', worldKey:null, mode:null,
  qIndex:0, questions:[], gems:0, correctFirstTry:0, attempts:0,
  studyIndex:0,
  examAnswers:[], examScore:0
};

function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function worldOf(key){ return WORLDS.find(w=>w.key===key); }

/* ================= NAVEGACIÓN ================= */
function goHome(){ state.screen='home'; render(); }
function openWorld(key){ state.worldKey=key; state.screen='worldMenu'; render(); }
function startStudy(key){ state.worldKey=key; state.studyIndex=0; state.screen='study'; render(); }
function startPractice(key){
  state.worldKey=key; state.mode='practice';
  state.questions = shuffle(QB[key]);
  state.qIndex=0; state.gems=0; state.correctFirstTry=0; state.attempts=0;
  state.screen='quiz'; render();
}
function startFinal(){
  let all=[];
  Object.keys(EXAM_PLAN).forEach(k=>{
    const n=EXAM_PLAN[k];
    const picked=shuffle(QB[k]).slice(0,n).map(q=>({...q, topic:k}));
    all=all.concat(picked);
  });
  state.questions=shuffle(all);
  state.qIndex=0; state.examAnswers=[]; state.examScore=0;
  state.mode='exam'; state.screen='quiz'; render();
}

/* ================= RENDER ================= */
function render(){
  const root=document.getElementById('root');
  if(state.screen==='home') root.innerHTML=renderHome();
  else if(state.screen==='worldMenu') root.innerHTML=renderWorldMenu();
  else if(state.screen==='study') root.innerHTML=renderStudy();
  else if(state.screen==='quiz') root.innerHTML=renderQuiz();
  else if(state.screen==='worldResult') root.innerHTML=renderWorldResult();
  else if(state.screen==='examResult') root.innerHTML=renderExamResult();
  window.scrollTo(0,0);
}

function renderHome(){
  return `
  <h1 class="title">⛏️ CraftHistoria</h1>
  <p class="subtitle">La Aventura del I Periodo &mdash; Décimo Año</p>
  <div class="panel center small">
    Explora 6 mundos para dominar la Revolución Rusa, la Crisis de 1929 y la Segunda Guerra Mundial. Estudia, practica y luego enfréntate al <b>Examen Final</b>.
  </div>
  <div class="world-grid">
    ${WORLDS.map(w=>`
      <div class="world-card" style="background:${w.bg}; border-color:${w.accent}" data-action="openWorld" data-key="${w.key}">
        <div class="emoji">${w.emoji}</div>
        <h3>${w.name}</h3>
        <p>${w.desc}</p>
        <div class="stat">📘 ${STUDY[w.key].length} fichas &nbsp; ❓ ${QB[w.key].length} preguntas</div>
      </div>
    `).join('')}
  </div>
  <div class="world-card mt" style="background:linear-gradient(160deg,#1a0000,#000); border-color:#ffd700;" data-action="goExamIntro">
    <div class="emoji">🐉</div>
    <h3 style="color:#ffd700">Examen Final: El Jefe Final</h3>
    <p>40 preguntas de todos los mundos. ¡Demuestra que dominas el I Periodo!</p>
  </div>
  `;
}

function renderWorldMenu(){
  const w=worldOf(state.worldKey);
  return `
  <div class="topbar" style="background:${w.accent}"><span>${w.emoji} ${w.name.toUpperCase()}</span><span data-action="goHome" style="cursor:pointer">🏠 MAPA</span></div>
  <div class="panel">
    <p>${w.desc}</p>
    <p class="small">Este mundo tiene <b>${STUDY[w.key].length}</b> fichas de estudio y <b>${QB[w.key].length}</b> preguntas de práctica.</p>
  </div>
  <button class="block-btn" style="background:${w.accent}" data-action="startStudy" data-key="${w.key}">📘 Modo Estudio</button>
  <div style="height:10px"></div>
  <button class="block-btn dirt" data-action="startPractice" data-key="${w.key}">⚔️ Modo Práctica</button>
  <div style="height:16px"></div>
  <button class="block-btn stone" data-action="goHome">← Volver al mapa</button>
  `;
}

function renderStudy(){
  const w=worldOf(state.worldKey);
  const cards=STUDY[state.worldKey];
  const i=state.studyIndex;
  const pct=Math.round(((i+1)/cards.length)*100);
  return `
  <div class="topbar" style="background:${w.accent}"><span>${w.emoji} ESTUDIO</span><span>${i+1}/${cards.length}</span></div>
  <div class="progresswrap"><div class="progressbar" style="width:${pct}%"></div></div>
  <div class="flash"><span class="n">FICHA ${i+1}</span>${cards[i]}</div>
  <div class="row">
    <button class="block-btn stone" data-action="studyPrev" ${i===0?'disabled':''}>← Anterior</button>
    ${i===cards.length-1
      ? `<button class="block-btn" style="background:${w.accent}" data-action="openWorld" data-key="${w.key}">Terminar ✔</button>`
      : `<button class="block-btn" style="background:${w.accent}" data-action="studyNext">Siguiente →</button>`}
  </div>
  <div style="height:16px"></div>
  <button class="block-btn dirt" data-action="goHome">🏠 Volver al mapa</button>
  `;
}
function studyNext(){ state.studyIndex++; render(); }
function studyPrev(){ state.studyIndex--; render(); }

function renderQuiz(){
  const isExam = state.mode==='exam';
  const w = isExam ? null : worldOf(state.worldKey);
  const total = state.questions.length;
  const i = state.qIndex;
  const q = state.questions[i];
  const pct = Math.round((i/total)*100);
  const accent = isExam ? '#ffd700' : w.accent;
  const label = isExam ? `🐉 EXAMEN FINAL` : `${w.emoji} ${w.name.toUpperCase()}`;
  const rightbadge = isExam ? `Pregunta ${i+1}/${total}` : `💎 ${state.gems}`;
  return `
  <div class="topbar" style="background:${accent}; color:${isExam?'#1a1000':'#fff'}"><span>${label}</span><span class="badge">${rightbadge}</span></div>
  <div class="progresswrap"><div class="progressbar" style="width:${pct}%; background:${accent}"></div></div>
  <div class="qbox">${q.q}</div>
  <div id="options">
    ${q.o.map((opt,idx)=>`<button class="option" data-action="answer" data-idx="${idx}">${opt}</button>`).join('')}
  </div>
  <div id="feedback"></div>
  <div style="height:10px"></div>
  <button class="block-btn stone" data-action="${isExam?'goHome':'openWorld'}" data-key="${state.worldKey}">✖ Salir</button>
  `;
}

function answer(idx){
  const q = state.questions[state.qIndex];
  const opts = document.querySelectorAll('#options .option');
  const isExam = state.mode==='exam';
  opts.forEach(o=>o.classList.add('disabled'));

  if(isExam){
    // examen: un solo intento, avanza al confirmar
    const correct = idx===q.a;
    if(correct) state.examScore++;
    state.examAnswers.push({...q, chosen:idx, correct});
    opts[q.a].classList.add('correct');
    if(!correct) opts[idx].classList.add('incorrect');
    document.getElementById('feedback').innerHTML =
      `<div class="explain ${correct?'':'bad'}">${correct?'✅ ¡Correcto! ':'❌ Incorrecto. '}${q.e}</div>
       <button class="block-btn gold" data-action="nextExam">${state.qIndex===state.questions.length-1?'Ver resultados 🏆':'Siguiente →'}</button>`;
  } else {
    // práctica: reintentar hasta acertar
    state.attempts++;
    if(idx===q.a){
      if(state.attempts===1){ state.gems+=10; state.correctFirstTry++; }
      else { state.gems+=2; }
      opts[idx].classList.add('correct');
      document.getElementById('feedback').innerHTML =
        `<div class="explain">✅ ¡Correcto! ${q.e}</div>
         <button class="block-btn" style="background:${worldOf(state.worldKey).accent}" data-action="nextPractice">${state.qIndex===state.questions.length-1?'Ver resultados 🏆':'Siguiente →'}</button>`;
    } else {
      opts[idx].classList.add('incorrect');
      opts.forEach(o=>o.classList.remove('disabled'));
      opts[idx].classList.add('disabled');
      document.getElementById('feedback').innerHTML =
        `<div class="explain bad">❌ Intenta de nuevo. Pista: revisa bien las opciones restantes.</div>`;
    }
  }
}
function nextPractice(){
  state.attempts=0;
  if(state.qIndex < state.questions.length-1){ state.qIndex++; render(); }
  else { state.screen='worldResult'; render(); }
}
function nextExam(){
  if(state.qIndex < state.questions.length-1){ state.qIndex++; render(); }
  else { state.screen='examResult'; render(); }
}

function renderWorldResult(){
  const w=worldOf(state.worldKey);
  const total=state.questions.length;
  return `
  <h1 class="title">🏆 ¡Mundo completado!</h1>
  <div class="panel center">
    <div class="score-big">💎 ${state.gems}</div>
    <p>Gemas obtenidas en <b>${w.name}</b></p>
    <p class="small">Aciertos al primer intento: ${state.correctFirstTry} / ${total}</p>
  </div>
  <button class="block-btn" style="background:${w.accent}" data-action="startPractice" data-key="${w.key}">🔁 Reintentar mundo</button>
  <div style="height:10px"></div>
  <button class="block-btn stone" data-action="goHome">🏠 Volver al mapa</button>
  `;
}

function renderExamResult(){
  const total=state.questions.length;
  const score100=Math.round((state.examScore/total)*100);
  let msg,color;
  if(score100>=90){msg='¡Excelente! Dominas el I Periodo.'; color='#5cc95c';}
  else if(score100>=80){msg='¡Muy bueno! Vas muy sólido.'; color='#9ccc65';}
  else if(score100>=65){msg='Aprobado. Bien, pero repasa los temas fallados.'; color='#ffd700';}
  else {msg='Necesitas repasar antes del examen real.'; color='#e13a2e';}

  const byTopic={};
  state.examAnswers.forEach(a=>{
    byTopic[a.topic]=byTopic[a.topic]||{ok:0,total:0};
    byTopic[a.topic].total++;
    if(a.correct) byTopic[a.topic].ok++;
  });

  return `
  <h1 class="title">🐉 Resultado del Examen Final</h1>
  <div class="panel center">
    <div class="score-big" style="color:${color}">${score100} / 100</div>
    <p style="color:${color}">${msg}</p>
    <p class="small">${state.examScore} de ${total} preguntas correctas</p>
  </div>
  <div class="panel">
    <p class="pixel-font" style="font-size:11px; color:#ffd700; margin-bottom:10px;">DESGLOSE POR MUNDO</p>
    ${Object.keys(byTopic).map(k=>{
      const w=worldOf(k); const b=byTopic[k]; const p=Math.round((b.ok/b.total)*100);
      return `<div class="small" style="margin-bottom:8px;">${w.emoji} ${w.name}: ${b.ok}/${b.total} (${p}%)
        <div class="progresswrap" style="height:10px;"><div class="progressbar" style="width:${p}%; background:${w.accent}"></div></div></div>`;
    }).join('')}
  </div>
  <button class="block-btn gold" data-action="showReview">📋 Ver repaso de respuestas</button>
  <div style="height:10px"></div>
  <button class="block-btn" data-action="startFinal">🔁 Repetir examen final</button>
  <div style="height:10px"></div>
  <button class="block-btn stone" data-action="goHome">🏠 Volver al mapa</button>
  <div id="reviewArea"></div>
  `;
}

function showReview(){
  const area=document.getElementById('reviewArea');
  area.innerHTML = `<div class="panel mt"><p class="pixel-font" style="font-size:11px;color:#ffd700;margin-bottom:10px;">REPASO</p>` +
    state.examAnswers.map((a,i)=>`
      <div class="review-item ${a.correct?'right':'wrong'}">
        <span class="tag">${worldOf(a.topic).name}</span>
        <p><b>${i+1}. ${a.q}</b></p>
        <p>Tu respuesta: ${a.o[a.chosen]} ${a.correct?'✅':'❌'}</p>
        ${!a.correct?`<p>Correcta: ${a.o[a.a]}</p>`:''}
        <p class="small">${a.e}</p>
      </div>
    `).join('') + `</div>`;
}

function goExamIntro(){
  document.getElementById('root').innerHTML = `
  <h1 class="title">🐉 Examen Final</h1>
  <div class="panel">
    <p>Este es el jefe final del I Periodo: <b>40 preguntas</b> tomadas de los 6 mundos, con la misma proporción que un examen real del MEP.</p>
    <p class="small">Cada pregunta tiene un solo intento. Al final verás tu nota sobre 100, el desglose por tema y el repaso completo de respuestas.</p>
  </div>
  <button class="block-btn gold" data-action="startFinal">⚔️ Comenzar Examen Final</button>
  <div style="height:10px"></div>
  <button class="block-btn stone" data-action="goHome">🏠 Volver al mapa</button>
  `;
}

/* ================= EVENTOS ================= */
document.getElementById('root').addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  const key = el.dataset.key;
  const idx = el.dataset.idx;
  if(action==='openWorld') openWorld(key);
  else if(action==='goHome') goHome();
  else if(action==='startStudy') startStudy(key);
  else if(action==='startPractice') startPractice(key);
  else if(action==='studyNext') studyNext();
  else if(action==='studyPrev') studyPrev();
  else if(action==='answer') answer(parseInt(idx));
  else if(action==='nextPractice') nextPractice();
  else if(action==='nextExam') nextExam();
  else if(action==='goExamIntro') goExamIntro();
  else if(action==='startFinal') startFinal();
  else if(action==='showReview') showReview();
});

render();
</script>
</body>
</html>
